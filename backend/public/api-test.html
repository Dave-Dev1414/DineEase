<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineEase API Tester</title>
</head>
<body>

    <h1>DineEase API Tester</h1>

    <form id="signupForm" novalidate>
        <label>
            Name
            <input type="text" id="name">
        </label>

        <br><br>

        <label>
            Email
            <input type="email" id="email">
        </label>

        <br><br>

        <label>
            Password
            <input type="password" id="password">
        </label>

        <br><br>

        <button type="submit">Create Account</button>
    </form>

    <h2>Response</h2>
    <pre id="response"></pre>


   <script>
    const form = document.getElementById("signupForm");
    const responseBox = document.getElementById("response");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/dineease/api/users", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            });

            const result = await response.json();

           if (result.success === true) {
           alert("SUCCESS: redirecting now");

             window.location.assign(
            `http://localhost:5173/check-email?email=${encodeURIComponent(email)}`
            );

         return;
              }

            responseBox.textContent = JSON.stringify(
                result,
                null,
                2
            );

        } catch (error) {
            responseBox.textContent = JSON.stringify(
                {
                    success: false,
                    message: "Unable to connect to DineEase."
                },
                null,
                2
            );
        }
    });
</script>
</body>
</html>
